[package]
name = "nextool-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "NexToolkit 命令行工具"

[[bin]]
name = "nextool"
path = "src/main.rs"

[dependencies]
nextool-core = { path = "../core" }
nextool-fileconv = { path = "../fileconv" }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
