[package]
name = "nextool-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "NexToolkit 核心逻辑库:纯 Rust,无 UI 依赖"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }

# encode
urlencoding = "2.1"
html-escape = "0.2"
hex = "0.4"

# convert
serde_yaml = "0.9"
toml = "0.8"
csv = "1.3"
pulldown-cmark = "0.12"

# format
sqlformat = "0.3"
quick-xml = "0.36"
minifier = "0.3"

# generate
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
rand = "0.8"
qrcode = "0.14"

# text
regex = "1.10"
similar = "2.5"

# crypto
aes-gcm = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
argon2 = "0.5"
pbkdf2 = { version = "0.12", features = ["std", "hmac"] }

# nettime
ipnet = "2.9"
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
cron = "0.12"
hickory-resolver = "0.24"

# http(纯 Rust TLS,无 OpenSSL)
ureq = { version = "2", features = ["tls"] }
